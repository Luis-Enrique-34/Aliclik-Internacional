<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Panel | Aliclik Internacional</title>
    <link rel="icon" type="image/png" href="assets/img/isotipo.png">
    <script src="assets/js/theme.js"></script>
    <link rel="stylesheet" href="assets/vendor/fonts/fonts.css">
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
    <div class="boot" id="boot"><img src="assets/img/isotipo.png" alt="Cargando"></div>

    <div class="layout" id="layout" hidden>
        <aside class="sidebar" id="sidebar" aria-label="Menú principal">
            <a href="#/inicio" class="sidebar-logo">
                <img src="assets/img/logo-blanco.png" alt="Aliclik">
                <span class="tag">Internacional</span>
            </a>
            <nav id="nav"></nav>
            <div class="sidebar-user">
                <span class="avatar" id="userAvatar"></span>
                <div class="info">
                    <strong id="userName"></strong>
                    <span id="userRole"></span>
                </div>
                <button class="icon-btn" id="logoutBtn" title="Cerrar sesión" aria-label="Cerrar sesión"><i class="fas fa-right-from-bracket"></i></button>
            </div>
        </aside>

        <div class="main">
            <header class="topbar">
                <button class="icon-btn" id="menuBtn" aria-label="Abrir menú"><i class="fas fa-bars"></i></button>
                <div>
                    <h1 id="titulo">Inicio</h1>
                    <div class="sub" id="subtitulo"></div>
                </div>
                <div class="acciones">
                    <div id="accionesVista" class="fila-flex"></div>
                    <button class="theme-toggle" data-theme-toggle aria-label="Cambiar tema" title="Cambiar tema"><i class="fas fa-moon"></i><i class="fas fa-sun"></i></button>
                </div>
            </header>
            <main class="contenido" id="vista" tabindex="-1"></main>
        </div>
    </div>

    <div id="toasts" aria-live="polite"></div>
    <script type="module" src="assets/js/app/main.js"></script>
</body>
</html>
